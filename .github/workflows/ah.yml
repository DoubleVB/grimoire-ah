name: Scan AH
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min: GitHub skips many scheduled runs; Blizzard publishes at about :22 each hour and unchanged data is not stored twice
  workflow_dispatch:        # "Run workflow" button to test by hand
permissions:
  contents: write
concurrency: scan-ah
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Get the previous data (branch "data")
        shell: bash
        run: |
          set -euo pipefail
          # exit code 2 = the branch does not exist (first run). Any other failure stops the run: starting from
          # empty data would publish (force-push) a branch with the whole history erased.
          rc=0; git ls-remote --exit-code --heads origin data >/dev/null || rc=$?
          if [ "$rc" -eq 2 ]; then echo "First run: no data yet"; exit 0; fi
          if [ "$rc" -ne 0 ]; then echo "::error::Cannot reach branch data (git ls-remote exit $rc)"; exit 1; fi
          git fetch origin data --depth=1
          git archive --format=tar FETCH_HEAD | tar -x -C data
          [ -f data/index.json ] || { echo "::error::Branch data exists but has no index.json: not overwriting it"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan every auction house
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          REGION: ${{ vars.REGION || 'eu' }}
          NAMESPACE: ${{ vars.NAMESPACE || 'dynamic-forever-eu' }}
          KEEP_DAYS: "7"
        run: node scripts/fetch-ah.mjs
      - name: Publish the data (branch "data", one commit, no history so the repo stays small)
        run: |
          [ -f data/index.json ] || exit 0
          mkdir -p /tmp/out && cp -r data/. /tmp/out/ && rm -f /tmp/out/items.json
          cd /tmp/out
          git init -q -b data
          git config user.name "profitmancer-bot"
          git config user.email "profitmancer-bot@users.noreply.github.com"
          git add . && git commit -qm "AH scan $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
