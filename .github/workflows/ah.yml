name: Scan AH
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min: GitHub skips many scheduled runs; Blizzard publishes at about :22 each hour and unchanged data is not stored twice
  workflow_dispatch:        # "Run workflow" button to test by hand
permissions:
  contents: write
concurrency: scan-ah
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Get the previous data (branch "data")
        run: |
          if git fetch origin data --depth=1 2>/dev/null; then git archive --format=tar FETCH_HEAD | tar -x -C data; else echo "First run: no data yet"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan every auction house
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          REGION: ${{ vars.REGION || 'eu' }}
          NAMESPACE: ${{ vars.NAMESPACE || 'dynamic-forever-eu' }}
          RULESET: ${{ vars.RULESET }}
          AH_IDS: ${{ vars.AH_IDS }}
          KEEP_DAYS: "7"
        run: node scripts/fetch-ah.mjs
      - name: Publish the data (branch "data", one commit, no history so the repo stays small)
        run: |
          [ -f data/index.json ] || exit 0
          mkdir -p /tmp/out && cp -r data/. /tmp/out/ && rm -f /tmp/out/items.json
          cd /tmp/out
          git init -q -b data
          git config user.name "grimoire-bot"
          git config user.email "grimoire-bot@users.noreply.github.com"
          git add . && git commit -qm "AH scan $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
